# Профілі збірки ПТІР. Версія ядра і версії бібліотек закріплені: однакові в усіх студентів.
#   *-wokwi — для симулятора Wokwi, без суфікса — для реальної плати.
#   PartitionScheme=no_ota — 2 МБ під програму і 2 МБ під файлову систему:
#   прошивка з мережею, дисплеєм і TLS уже не вміщується у стандартні 1,2 МБ.
profiles:
  s2-wokwi:
    notes: Wemos S2 Mini у Wokwi (Serial через UART0)
    fqbn: esp32:esp32:lolin_s2_mini:CDCOnBoot=dis_cdc,PartitionScheme=no_ota
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - hd44780 (1.3.2)
      - TM1637 (1.2.0)
      - DHT sensor library (1.4.7)
      - Adafruit Unified Sensor (1.1.15)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
  s2:
    notes: Wemos S2 Mini, реальна плата (Serial через USB)
    fqbn: esp32:esp32:lolin_s2_mini:PartitionScheme=no_ota
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - hd44780 (1.3.2)
      - TM1637 (1.2.0)
      - DHT sensor library (1.4.7)
      - Adafruit Unified Sensor (1.1.15)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
  c3-wokwi:
    notes: ESP32-C3 Super Mini у Wokwi (Serial через USB Serial/JTAG)
    fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=no_ota
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - hd44780 (1.3.2)
      - TM1637 (1.2.0)
      - DHT sensor library (1.4.7)
      - Adafruit Unified Sensor (1.1.15)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
  c3:
    notes: ESP32-C3 Super Mini, реальна плата
    fqbn: esp32:esp32:nologo_esp32c3_super_mini:PartitionScheme=no_ota
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.12.6)
      - Adafruit BusIO (1.17.4)
      - hd44780 (1.3.2)
      - TM1637 (1.2.0)
      - DHT sensor library (1.4.7)
      - Adafruit Unified Sensor (1.1.15)
      - OneWire (2.3.8)
      - DallasTemperature (4.0.6)
default_profile: s2-wokwi
